[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-token-balancing-gateway"
version = "0.1.0.dev0"
description = "OpenAI-compatible gateway that routes, validates, repairs, and escalates across heterogeneous LLM providers."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "fastapi>=0.115",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy>=2.0.36",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "mypy>=1.13",
    # Dev-only: proves unmodified OpenAI SDK code works against the gateway.
    # Never makes a network call -- the client is bound to the in-process app.
    "openai>=1.60",
    "psycopg[binary]>=3.2",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.7",
]

[project.scripts]
gateway = "gateway.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "B",    # bugbear
    "UP",   # pyupgrade
    "S",    # flake8-bandit
    "ANN",  # flake8-annotations
    "RUF",
]
# ANN101/ANN102 (self/cls annotations) are deprecated in ruff and not useful here.
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
# Tests may use asserts and skip return annotations on test functions.
# S105 fires on fixture strings that merely look like credentials.
"tests/**" = ["S101", "S105", "ANN201", "ANN001"]
# Alembic writes these; reformatting generated migrations invites merge pain
# and makes the file diverge from what autogenerate would produce again.
"src/gateway/persistence/migrations/versions/*" = ["E501"]
# B008 forbids function calls in argument defaults, but Depends() in a
# signature is exactly how FastAPI declares dependencies.
"src/gateway/api/*" = ["B008"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["gateway"]
strict = true
warn_unreachable = true
disallow_any_generics = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"
markers = [
    "integration: exercises real I/O such as a database (deselect with -m 'not integration')",
    "contract: pins public wire behaviour, including real-SDK compatibility",
    "e2e: drives a request through the whole orchestration path",
]
