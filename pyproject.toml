[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-token-balancing-gateway"
version = "0.1.0.dev0"
description = "OpenAI-compatible gateway that routes, validates, repairs, and escalates across heterogeneous LLM providers."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.7",
]

[project.scripts]
gateway = "gateway.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "B",    # bugbear
    "UP",   # pyupgrade
    "S",    # flake8-bandit
    "ANN",  # flake8-annotations
    "RUF",
]
# ANN101/ANN102 (self/cls annotations) are deprecated in ruff and not useful here.
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
# Tests may use asserts and skip return annotations on test functions.
"tests/**" = ["S101", "ANN201", "ANN001"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["gateway"]
strict = true
warn_unreachable = true
disallow_any_generics = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "integration: exercises real I/O such as a database (deselect with -m 'not integration')",
]
